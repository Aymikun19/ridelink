<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="description" content="RideLink connects customers with nearby drivers, with live maps, in-ride chat and voice notes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
    <title>RideLink</title>
    <style>
      #rl-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0b0b; }
      html:not(.dark) #rl-splash { background: #f7f6f2; }
      .rl-splash-mark { position: relative; filter: drop-shadow(0 0 0 rgba(201, 168, 76, 0)); animation: rl-splash 2s ease-in-out infinite; }
      @keyframes rl-splash { 0%, 100% { filter: drop-shadow(0 0 6px rgba(201, 168, 76, 0.25)); } 50% { filter: drop-shadow(0 0 28px rgba(201, 168, 76, 0.75)); } }
    </style>
    <script>
      try { if (localStorage.getItem("theme") === "light") document.documentElement.classList.remove("dark"); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app loads; React replaces it. -->
      <div id="rl-splash">
        <div class="rl-splash-mark">
          <svg viewBox="0 0 64 64" width="80" height="80" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#0b0b0b"/><path d="M20 44V20h13a8 8 0 0 1 0 16h-6l10 8" fill="none" stroke="#c9a84c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47" cy="22" r="4" fill="#fff"/></svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
